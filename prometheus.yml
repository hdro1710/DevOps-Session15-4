global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dummy-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dummy-backend:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'microservices'
    file_sd_configs:
      - files:
          - 'targets.json'
